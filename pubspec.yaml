name: sga_bojanini
description: "SGA Bojanini - app móvil para empleados de la Clínica Bojanini."
publish_to: 'none'

# x.y.z+build — el build SIEMPRE crece (Android no instala versiones menores).
version: 1.2.0+13

environment:
  sdk: ^3.10.8

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  file_picker: ^13.4.1
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^17.5.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.9.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdfx: ^2.11.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: 2.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  json_serializable: 6.11.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.1.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/splash_mark.png
    - assets/fonts/montserrat/OFL.txt
    - assets/certs/sga_clinica.pem

  # Montserrat (OFL, ver assets/fonts/montserrat/OFL.txt). Decisión E: tipografía definitiva.
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700

# Splash nativo (marca provisional sobre azul pizarra). Regenerar: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1E2A3B"
  image: assets/brand/splash_mark.png
  android_12:
    color: "#1E2A3B"
    image: assets/brand/splash_mark.png
  ios: false
  web: false
